<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="calculator">
        <div class="row">
            <div id="visor"></div>
        </div>
        <div class="row">
            <button class="button extra" id="all-clear">AC</button>
            <button class="button extra" id="backspace">←</button>
            <button class="button dummy"></button>
            <button class="button operator" id="divide">÷</button>
        </div>
        <div class="row">
            <button class="button number" id="num7">7</button>
            <button class="button number" id="num8">8</button>
            <button class="button number" id="num9">9</button>
            <button class="button operator" id="multiply">x</button>
        </div>
        <div class="row">
            <button class="button number" id="num4">4</button>
            <button class="button number" id="num5">5</button>
            <button class="button number" id="num6">6</button>
            <button class="button operator" id="subtract">-</button>
        </div>
        <div class="row">
            <button class="button number" id="num1">1</button>
            <button class="button number" id="num2">2</button>
            <button class="button number" id="num3">3</button>
            <button class="button operator" id="add">+</button>
        </div>
        <div class="row">
            <button class="button number" id="num0">0</button>
            <button class="button extra" id="dot">.</button>
            <button class="button dummy"></button>
            <button class="button operator" id="equals">=</button>
        </div>
    </div>
</body>
</html>
